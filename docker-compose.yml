services:
  postgres:
    image: postgres:16-alpine
    container_name: gopay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gopay_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gopay_secret}
      POSTGRES_DB: ${DB_NAME:-gopay_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gopay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gopay_user} -d ${DB_NAME:-gopay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopay_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gopay_user}
      DB_PASSWORD: ${DB_PASSWORD:-gopay_secret}
      DB_NAME: ${DB_NAME:-gopay_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  gopay_pgdata:
